name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      # Uncomment if you have tests
      # - name: Run tests
      #   run: pnpm test

  build-compile:
    name: Build (Compile Phase)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile application (no DB access)
        run: pnpm build:compile

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-artifact
          path: .next

  build-generate-and-deploy:
    name: Generate and Deploy
    runs-on: ubuntu-latest
    needs: build-compile
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build-artifact
          path: .next

      - name: Generate static pages (requires DB)
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          REVALIDATION_KEY: ${{ secrets.REVALIDATION_KEY }}
        run: pnpm build:generate

      # Example deploy step (adjust to your platform)
      # - name: Deploy to Vercel
      #   run: pnpm dlx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}

